spring:
  application:
    name: energy-news-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/energy_news}
    username: ${SPRING_DATASOURCE_USERNAME:energy_news}
    password: ${SPRING_DATASOURCE_PASSWORD:energy_news}
  jpa:
    hibernate:
      ddl-auto: update

app:
  translation:
    deepl:
      base-url: "${DEEPL_BASE_URL:https://api-free.deepl.com}"
      api-key: "${DEEPL_API_KEY:}"
  news-sync:
    cron: "0 0 2 * * *"
    zone: "Asia/Shanghai"
  news-filter:
    threshold: 3
    strong-keywords:
      - energy storage
      - battery storage
      - battery energy storage
      - BESS
      - grid battery
      - grid-battery
      - grid-scale battery
      - home battery
      - long-duration energy storage
      - LDES
      - thermal energy storage
      - flow battery
      - sodium-ion battery
    weak-keywords:
      - battery
      - LFP
      - lithium-ion
      - virtual power plant
      - VPP
      - PCS
      - power conversion
