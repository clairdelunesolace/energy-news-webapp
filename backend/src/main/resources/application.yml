spring:
  application:
    name: energy-news-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/energy_news}
    username: ${SPRING_DATASOURCE_USERNAME:energy_news}
    password: ${SPRING_DATASOURCE_PASSWORD:energy_news}
  jpa:
    hibernate:
      ddl-auto: update

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  discovery:
    provider: ${NEWS_DISCOVERY_PROVIDER:none}
    brave:
      api-key: "${BRAVE_SEARCH_API_KEY:}"
    gnews:
      api-key: "${GNEWS_API_KEY:}"
      max-results-per-request: ${GNEWS_MAX_RESULTS_PER_REQUEST:10}
  security:
    admin:
      username: "${ADMIN_USERNAME:admin}"
      password: "${ADMIN_PASSWORD:}"
  translation:
    deepl:
      base-url: "${DEEPL_BASE_URL:https://api-free.deepl.com}"
      api-key: "${DEEPL_API_KEY:}"
  news-sync:
    cron: "0 0 20 * * *"
    zone: "Asia/Shanghai"
  news-filter:
    threshold: 3
    strong-keywords:
      - energy storage
      - battery storage
      - battery energy storage
      - BESS
      - grid battery
      - grid-battery
      - grid-scale battery
      - home battery
      - long-duration energy storage
      - LDES
      - thermal energy storage
      - flow battery
      - sodium-ion battery
      - energy storage system
      - grid-scale storage
      - stationary battery
      - stationary storage
      - utility-scale battery
      - residential battery
    weak-keywords:
      - battery
      - LFP
      - lithium-ion
      - virtual power plant
      - VPP
      - PCS
      - power conversion
      - grid-forming
      - behind-the-meter
